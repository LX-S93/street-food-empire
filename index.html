<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Imbiss">
<meta name="theme-color" content="#151a20">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Imbiss-Imperium</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Caveat:wght@600;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: fester Kopf mit Kasse und Tagesuhr, darunter einspaltige Karten, Tab-Leiste am unteren Rand.
     Senfgelb ist die einzige Akzentfarbe; Gut/Warnung/Kritisch sind eigene Signalfarben. */
  --bg:#ECEFF3; --surface:#FFFFFF; --sunk:#E0E5EB; --ink:#141F2A; --muted:#566371; --line:#D0D7DF;
  --accent:#F0B21A; --accent-ink:#1C1503; --accent-text:#855A00;
  --good:#17805A; --warn:#B26400; --bad:#C2332A;
  --bon:#FBFAF4; --bon-ink:#22262B;
  --f-display:'Bricolage Grotesque','Arial Narrow',system-ui,sans-serif;
  --f-body:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'DM Mono',ui-monospace,'SF Mono',Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F161D; --surface:#19222C; --sunk:#222D39; --ink:#EEF2F5; --muted:#97A4B1; --line:#2C3846;
    --accent:#F4B92A; --accent-ink:#1C1503; --accent-text:#F4B92A;
    --good:#4CC391; --warn:#F1A640; --bad:#F26D62;
    --bon:#232C36; --bon-ink:#E9EDF0;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F161D; --surface:#19222C; --sunk:#222D39; --ink:#EEF2F5; --muted:#97A4B1; --line:#2C3846;
  --accent:#F4B92A; --accent-ink:#1C1503; --accent-text:#F4B92A;
  --good:#4CC391; --warn:#F1A640; --bad:#F26D62;
  --bon:#232C36; --bon-ink:#E9EDF0;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--f-body);-webkit-text-size-adjust:100%;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
h2{font:800 24px/1.1 var(--f-display);letter-spacing:-.01em;text-wrap:balance}
h3{font:600 16px/1.2 var(--f-display)}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}

/* Kopf */
#top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
#tabs{padding-bottom:env(safe-area-inset-bottom)}
#top .wrap{padding-top:10px;padding-bottom:8px;display:grid;gap:8px}
.bar{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.brand{font:800 13px/1 var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:var(--accent-text)}
.dayInfo{font:500 12px/1 var(--f-mono);color:var(--muted)}
.money{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.cash{font:800 34px/1 var(--f-display);letter-spacing:-.02em}
.cash.neg{color:var(--bad)}
.side{text-align:right;font:500 13px/1.25 var(--f-mono)}
.lbl{font:500 11px/1.2 var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.clock{position:relative;height:22px;border-radius:4px;background:var(--sunk);overflow:hidden}
.clock svg{display:block;width:100%;height:100%}
.clock path{fill:var(--accent);opacity:.55}
.clock i{position:absolute;top:0;bottom:0;width:2px;background:var(--ink)}
.clock b{position:absolute;top:0;bottom:0;left:0;background:var(--ink);opacity:.12}
#alert:empty{display:none}
#alert{font-size:13px;line-height:1.35;padding:8px 10px;border-radius:6px;border:1px solid var(--bad);color:var(--bad);background:color-mix(in srgb,var(--bad) 9%,var(--surface))}
#chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px 2px}
#chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid var(--line);border-radius:999px;background:var(--bg);font-size:13px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--good)}
.dot.warn{background:var(--warn)} .dot.bad{background:var(--bad)}

/* Inhalt */
#view{padding:14px 0 96px;display:grid;gap:12px}
#view>.wrap{display:grid;gap:12px;width:100%}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sub{color:var(--muted);font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:10px}
.card.flat{background:transparent;border-style:dashed}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.row.top{align-items:flex-start}
.row>.grow{flex:1;min-width:0}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.small{font-size:13px;color:var(--muted)}
.num{font-family:var(--f-mono);font-weight:500}
.pos{color:var(--good)} .neg{color:var(--bad)} .wrn{color:var(--warn)}
.pill{flex:none;font:500 12px/1 var(--f-body);padding:5px 9px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.pill.good{color:var(--good)} .pill.warn{color:var(--warn)} .pill.bad{color:var(--bad)} .pill.mute{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:8px 14px;border-radius:8px;border:1px solid var(--ink);background:transparent;font-weight:600;font-size:14px;cursor:pointer;text-align:left}
.btn .cost{font:500 13px/1 var(--f-mono);opacity:.8}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.sm{min-height:34px;padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:active:not(:disabled){transform:translateY(1px)}
:focus-visible{outline:2px solid var(--accent-text);outline-offset:2px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:6px;align-content:start}
.stat.wide{grid-column:1/-1}
.stat .v{font:800 22px/1 var(--f-display)}
.meter{height:8px;border-radius:4px;background:var(--sunk);position:relative;overflow:hidden}
.meter i{position:absolute;left:0;top:0;bottom:0;background:var(--good);border-radius:4px}
.meter.warn i{background:var(--warn)} .meter.bad i{background:var(--bad)} .meter.acc i{background:var(--accent)}
.meter u{position:absolute;top:0;bottom:0;width:2px;background:var(--ink)}
.queue{display:flex;flex-wrap:wrap;gap:3px}
.queue s{width:9px;height:9px;border-radius:50%;border:1px solid var(--line);background:transparent}
.queue s.on{background:var(--accent);border-color:var(--accent)}
.emp{border-top:1px dashed var(--line);padding-top:10px;display:grid;gap:6px}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.facts{display:grid;grid-template-columns:78px 1fr;gap:5px 10px;margin:0;font-size:13.5px}
.facts dt{color:var(--muted)}
.facts dd{margin:0}
.tip{border-left:4px solid var(--accent);background:var(--surface);border-radius:4px 10px 10px 4px;padding:10px 12px;font-size:14px}
.event{border:1px solid var(--warn);border-radius:10px;padding:12px;display:grid;gap:8px;background:color-mix(in srgb,var(--warn) 8%,var(--surface))}
.event.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 8%,var(--surface))}
.event.good{border-color:var(--good);background:color-mix(in srgb,var(--good) 8%,var(--surface))}

/* Kassenbon */
.bon{background:var(--bon);color:var(--bon-ink);font:400 13px/1.55 var(--f-mono);padding:16px 14px 20px;border:1px solid var(--line);
  --z:8px;-webkit-mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/var(--z) 100%;mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/var(--z) 100%}
.bon .t{text-align:center;letter-spacing:.12em;font-weight:500}
.bon .l{display:flex;justify-content:space-between;gap:12px}
.bon hr{border:0;border-top:1px dashed currentColor;opacity:.5;margin:6px 0}
.bon .sum{font-weight:500;font-size:15px}

/* Speisekarte */
.prod.off{opacity:.62}
.sl{display:grid;grid-template-columns:58px 1fr 84px;align-items:center;gap:8px}
.sl.pr{grid-template-columns:1fr auto;gap:4px 8px}
.sl.pr .rng{grid-column:1/-1}
.sl.pr output{font-size:16px;color:var(--ink)}
.sl label{font-size:13px;color:var(--muted)}
.sl output{font:500 13px/1.2 var(--f-mono);text-align:right}
.sl .rng{display:flex;align-items:center;gap:6px;min-width:0}
.sl input[type=range]{flex:1;min-width:0;accent-color:var(--accent-text);height:28px}
.stp:disabled{opacity:.35;cursor:not-allowed}
.stp{flex:none;width:44px;height:40px;font-size:18px;border-radius:6px;border:1px solid var(--line);background:var(--bg);font-weight:600;cursor:pointer}
.calc{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font:500 13px/1.3 var(--f-mono);padding-top:8px;border-top:1px dashed var(--line)}
.switch{flex:none;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 10px;font-size:12px;cursor:pointer}
.switch[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;border-right:1px solid var(--line);background:transparent;padding:8px 4px;font-size:13px;cursor:pointer;display:grid;gap:2px}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.seg small{font:500 11px/1 var(--f-mono);opacity:.75}
select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px}
textarea{min-height:80px;font:12px/1.4 var(--f-mono);word-break:break-all}
.chart{width:100%;height:90px;display:block}
.log{display:grid;gap:6px;font-size:13px}
.log>div{display:grid;grid-template-columns:54px 1fr;gap:8px}
.log span{font-family:var(--f-mono);color:var(--muted)}

/* Tabs */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line)}
#tabs .wrap{display:grid;grid-template-columns:repeat(5,1fr);padding:0 4px}
#tabs button{border:0;background:transparent;padding:14px 2px 16px;font:600 13px/1 var(--f-body);color:var(--muted);cursor:pointer;border-top:3px solid transparent;margin-top:-1px}
#tabs button[aria-pressed="true"]{color:var(--ink);border-top-color:var(--accent)}

#toasts{position:fixed;left:0;right:0;bottom:64px;z-index:30;display:grid;gap:6px;justify-items:center;pointer-events:none;padding:0 16px}
.toast{background:var(--ink);color:var(--surface);padding:9px 14px;border-radius:8px;font-size:13px;max-width:520px;animation:rise .25s ease-out}
.toast.bad{background:var(--bad);color:#fff} .toast.good{background:var(--good);color:#fff}
@keyframes rise{from{transform:translateY(8px);opacity:.3}to{transform:none;opacity:1}}
#modal{position:fixed;inset:0;z-index:40;display:none;align-items:flex-end;justify-content:center;background:rgba(8,12,16,.6);padding:16px}
#modal.open{display:flex}
.bills{display:grid;gap:2px;margin-top:4px}
.bill{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center;padding:7px 2px;border-bottom:1px dashed var(--line);font-size:15px}
.bill .ic{width:18px;height:18px;color:var(--muted)}
.bill.mute{color:var(--muted)}
.bill.tot{border-bottom:0;border-top:2px solid var(--ink);margin-top:4px;padding-top:10px;font-weight:700;font-size:17px}
.bill.tot .num{font-size:22px}
#call{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 84px);z-index:45;display:none;justify-content:center;padding:0 12px;pointer-events:none}
#call.open{display:flex}
#call .ph{pointer-events:auto;width:100%;max-width:420px;background:#151a20;color:#fff;border-radius:22px;padding:16px;box-shadow:0 14px 40px rgba(0,0,0,.45);animation:rise .25s ease-out;display:grid;gap:12px}
#call .who{display:flex;align-items:center;gap:12px}
#call .av{width:52px;height:52px;border-radius:50%;background:#E8B53A;color:#151a20;display:grid;place-items:center;font:700 19px var(--f-body);position:relative;flex:none}
#call .ring .av::after{content:'';position:absolute;inset:-6px;border-radius:50%;border:2px solid rgba(232,181,58,.75);animation:ringp 1.2s ease-out infinite}
@keyframes ringp{from{transform:scale(.9);opacity:1}to{transform:scale(1.4);opacity:0}}
#call .nm{font:700 21px/1.15 var(--f-body)}
#call .sub2{font-size:12.5px;color:rgba(255,255,255,.65)}
#call .acts{display:flex;justify-content:space-around;padding:4px 0}
#call .rb{width:62px;height:62px;border-radius:50%;border:0;display:grid;place-items:center;color:#fff;cursor:pointer}
#call .rb .ic{width:27px;height:27px}
#call .rb.ok{background:#2E9E5B;animation:wig 1.1s ease-in-out infinite}
#call .rb.no{background:#D0453A}
#call .rb.no .ic{transform:rotate(135deg)}
@keyframes wig{0%,50%,100%{transform:rotate(0)}10%{transform:rotate(-14deg)}20%{transform:rotate(14deg)}30%{transform:rotate(-9deg)}40%{transform:rotate(6deg)}}
#call .bub{background:#26303a;border-radius:14px 14px 14px 4px;padding:10px 12px;font-size:15.5px;line-height:1.4}
#call .locs{display:grid;gap:6px;max-height:38vh;overflow:auto}
#call .lb{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:#26303a;color:#fff;border:1px solid #3a4754;border-radius:11px;padding:11px 12px;font:500 15px var(--f-body);cursor:pointer}
#call .lb.x{opacity:.38;text-decoration:line-through}
#call .btn:not(.pri){background:#26303a;color:#fff;border-color:#4a5866}
@media (prefers-reduced-motion:reduce){#call .rb.ok,#call .ring .av::after,#call .ph{animation:none}}
#modal .box{background:var(--surface);border-radius:14px;padding:18px;max-width:520px;width:100%;max-height:86%;overflow:auto;display:grid;gap:12px}
#modal ul{margin:0;padding-left:18px;display:grid;gap:6px}
@media (min-width:600px){#modal{align-items:center}}
@media (prefers-reduced-motion:reduce){.toast{animation:none}.btn:active:not(:disabled){transform:none}}

/* ===================== Imbiss-Look ===================== */
/* Gekachelte Wand als Hintergrund, Markise und Registrierkasse im Kopf, Zettel an der Bonschiene, Kreidetafel für die Speisekarte, Papier für Bewerbungen. */
:root{
  --tile:#F5F7F9; --grout:#DFE5EA; --board:#22302B; --board-ink:#F3F1E7; --board-mute:#A8B9AE; --wood:#8A5A2B;
  --paper:#FCF9EF; --note:#FFEFA0; --lcd:#10160F; --lcd-ink:#FFC533; --lcd-good:#7FE3AA; --lcd-bad:#FF8478; --awn2:#FFFFFF;
  --map-land:#E6EAE2; --map-water:#A8CBE1; --map-park:#BCD8B0; --map-road:#FFFFFF; --map-block:#D5DAD1;
  --shop-ink:#17212B; --shop-wall:#F7F2E6; --shop-glass:#9CC7DE; --shop-roof:#B5483B; --ground:#C9CED3;
  --sky-m:#FBE7C6; --sky-d:#CFE5F4; --sky-r:#B9C4CC; --sky-s:#E3EBF0; --sky-e:#F4C7A1; --sky-n:#27324B; --p1:#3E5C76; --p2:#9A4B3C; --p3:#5C7A4B;
  --f-sign:'Alfa Slab One','Rockwell','Georgia',serif; --f-hand:'Caveat','Segoe Print','Bradley Hand',cursive;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--tile:#121920; --grout:#1A232C; --board:#17221E; --wood:#5E3F20; --awn2:#EDE6D2;
    --map-land:#1B252D; --map-water:#234461; --map-park:#234231; --map-road:#35424F; --map-block:#222D37; --ground:#3A4550;}
}
:root[data-theme="dark"]{--tile:#121920; --grout:#1A232C; --board:#17221E; --wood:#5E3F20; --awn2:#EDE6D2;
  --map-land:#1B252D; --map-water:#234461; --map-park:#234231; --map-road:#35424F; --map-block:#222D37; --ground:#3A4550;}
body{background-color:var(--tile);background-image:linear-gradient(var(--grout) 1px,transparent 1px),linear-gradient(90deg,var(--grout) 1px,transparent 1px);background-size:46px 46px}
h2{font:400 23px/1.15 var(--f-sign);letter-spacing:.01em}
.brand{font:400 14px/1 var(--f-sign);letter-spacing:.08em}
.awning{height:22px;background:repeating-linear-gradient(90deg,var(--accent) 0 22px,var(--ink) 22px 44px);
  -webkit-mask:linear-gradient(#000,#000) top/100% 11px no-repeat,radial-gradient(circle 11px at 50% 0,#000 97%,#0000) 0 10px/22px 12px repeat-x;
  mask:linear-gradient(#000,#000) top/100% 11px no-repeat,radial-gradient(circle 11px at 50% 0,#000 97%,#0000) 0 10px/22px 12px repeat-x}
#top .wrap{padding-top:4px}
.register{background:var(--lcd);color:var(--lcd-ink);border-radius:8px;padding:10px 12px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;font-family:var(--f-mono);--good:var(--lcd-good);--bad:var(--lcd-bad);--muted:color-mix(in srgb,var(--lcd-ink) 62%,var(--lcd))}
.register .cash{font:500 30px/1 var(--f-mono);letter-spacing:-.01em}
.register .lbl{font-family:var(--f-mono)}
/* Stadtplan */
.map{position:relative;aspect-ratio:100/122;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--map-land)}
.map>svg{position:absolute;inset:0;width:100%;height:100%}
.pin{position:absolute;transform:translate(-50%,-62%);display:grid;justify-items:center;gap:1px;background:none;border:0;padding:2px;cursor:pointer;color:var(--ink)}
.pin svg{width:46px;height:38px;display:block;filter:drop-shadow(0 2px 1px rgba(0,0,0,.28))}
.pinL{font:600 11px/1.25 var(--f-body);background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:1px 5px;white-space:nowrap}
.pinS{font:500 10px/1.3 var(--f-mono);background:var(--surface);border-radius:3px;padding:0 4px}
.pin.free{transform:translate(-50%,-50%)}
.pin.free .plus{width:26px;height:26px;border-radius:50%;border:2px dashed var(--muted);display:grid;place-items:center;font:600 16px/1 var(--f-body);color:var(--muted);background:color-mix(in srgb,var(--surface) 75%,transparent)}
.pin.free .pinL{color:var(--muted);font-weight:500}
.pin.own.cur .pinL{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.pin .st{position:absolute;top:0;right:10px;width:12px;height:12px;border-radius:50%;border:2px solid var(--surface);background:var(--good)}
.pin.warn .st{background:var(--warn)} .pin.bad .st{background:var(--bad)}
/* Laden */
.locbar{display:flex;align-items:center;gap:8px}
.locbar .grow{flex:1;min-width:0;text-align:center;font:600 13px/1.2 var(--f-body);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scene{border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--surface)}
.scene svg{display:block;width:100%;height:auto}
/* Papier: Bons, Zettel, Bewerbungen bleiben in beiden Themen hell */
.stat,.bon,.tip,.app{--ink:#23272B;--muted:#5E646B;--line:#D9D3C3;--bg:#F1EDE0;--surface:#FCF9EF;--sunk:#E4DECE;--good:#17805A;--warn:#B26400;--bad:#C2332A;--accent-text:#855A00;color:var(--ink)}
.stats{position:relative;padding-top:16px}
.stats::before{content:"";position:absolute;left:-4px;right:-4px;top:0;height:8px;border-radius:4px;background:linear-gradient(#AEB6BE,#7C858E)}
.stat{background:var(--paper);border:0;border-radius:2px;box-shadow:0 6px 10px -7px rgba(0,0,0,.5);font-family:var(--f-mono)}
.stat:nth-child(odd){transform:rotate(-.4deg)} .stat:nth-child(even){transform:rotate(.35deg)} .stat.wide{transform:none}
.stat .v{font:500 22px/1 var(--f-mono)} .stat .lbl{font-family:var(--f-mono)}

  const used={};for(const q of cand){if(S.quests.length>=3)break;if(used[q.k])continue;used[q.k]=1;q.rew=Math.round(base*(q.k==='sell'||q.k==='serve'?1:1.3));S.quests.push(q);}

function questText(q){const l=S.locs.find(x=>x.id===q.loc),a=l?' ('+AREAS[l.area].n+')':'';

const nf0=new Intl.NumberFormat('de-DE',{maximumFractionDigits:0}),nf2=new Intl.NumberFormat('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2});
function eur(x){const a=Math.abs(x);const s=a>=1e6?nf2.format(a/1e6)+' Mio.':nf0.format(Math.round(a));return (x<=-0.5?'−':'')+s+' €';}
function eurS(x){return (x>=0.5?'+':'')+eur(x);}
function eur2(x){return (x<0?'−':'')+nf2.format(Math.abs(x))+' €';}
function n0(x){return nf0.format(Math.round(x));}
function toast(msg,kind){
  if(typeof document==='undefined'||ui.away)return;
  const box=document.getElementById('toasts');if(!box)return;
  const el=document.createElement('div');el.className='toast '+(kind||'');el.textContent=msg;box.appendChild(el);
  while(box.children.length>2)box.removeChild(box.firstChild);
  setTimeout(()=>{if(el.parentNode)el.parentNode.removeChild(el);},4200);
}

function meter(p,cls,mark){return '<div class="meter '+(cls||'')+'"><i style="width:'+clamp(p,0,100).toFixed(1)+'%"></i>'+(mark!=null?'<u style="left:'+clamp(mark,0,99).toFixed(1)+'%"></u>':'')+'</div>';}
function lvlCls(p){return p<40?'bad':p<65?'warn':'';}
function problems(loc,c){
  c=c||calc(loc);const T=TIERS[loc.tier],P=[],add=(k,tab,key,t,d,act)=>P.push({k,tab,key,t,d,act,loc:loc.id});
  const nocook=!(c.cooks>0),up=unitPrice(loc,1,loc.auto);
  if(!c.foods.length)add('bad','karte','nofood','Keine Gerichte auf der Karte','Ohne Angebot kommt niemand. Nimm mindestens ein Gericht auf die Karte.');
  if(nocook)add('bad','team','role:cook','Niemand kocht','Der Betrieb verkauft nichts. Stelle einen Koch ein oder arbeite hier selbst mit.');
  const use=dailyUse(loc,c)+loc.stock*c.spoil,days=use>0?loc.stock/use:99,autoOn=loc.auto&&(loc.tier>=1||loc.staff.lead>0);
  if(c.ek>0&&loc.stock<c.ek)add('bad','betrieb','stock','Lager leer','Gäste gehen wieder, der Ruf leidet.',['Auffüllen','buy',{f:1}]);
  else if(days<0.6&&!autoOn&&!nocook)add('warn','betrieb','stock','Lager fast leer','Die Ware reicht noch für etwa '+Math.max(1,Math.round(days*24))+' Stunden Betrieb.',['Auffüllen','buy',{f:1}]);
  for(const id in loc.broken){const M=MACH.find(m=>m.id===id);add('bad','ausbau','broken:'+id,M.n+' defekt','Bringt bis zur Reparatur keine Leistung.'+(loc.staff.lead?' Die Leitung lässt sie zum Tagesabschluss reparieren.':''),['Reparieren','repair',{m:id}]);}
  if(loc.ord<40)add('bad','betrieb','ord','Ordnung kritisch: '+n0(loc.ord)+' %','Weniger Leistung, unzufriedene Gäste, Bußgeld bei einer Kontrolle.',['Kontrollgang','check',{}]);
  else if(loc.ord<60)add('warn','betrieb','ord','Ordnung lässt nach: '+n0(loc.ord)+' %','Leistung und Zufriedenheit sinken bereits.',['Kontrollgang','check',{}]);
  if(c.cap>0&&c.foods.length&&c.demand>c.cap*1.1)add('warn','betrieb','cap','Engpass '+c.neck,'Es kommen etwa '+n0(c.demand)+' Gäste am Tag, ihr schafft '+n0(c.cap)+'. Wer zu lange wartet, geht und schadet dem Ruf.',c.neck==='Küche'?['Team','goto',{t:'team',k:'role:cook'}]:['Team','goto',{t:'team',k:'role:serv'}]);
  if(!nocook&&c.foods.length){
    const why=[];if(c.sat<-4)why.push('Preis und Leistung passen nicht');if(c.avgQ<T.exp-0.05)why.push('Qualität unter Erwartung');if(c.staffSat<-4)why.push('schwaches Personal');if(loc.ord<65)why.push('Unordnung');if(loc.last&&loc.last.lost>loc.last.served*0.15)why.push('Gäste gehen unbedient');
    if(loc.rep<25&&c.sTarget<loc.rep+2)add('bad','betrieb','rep','Schlechter Ruf: '+n0(loc.rep),'Kaum Laufkundschaft.'+(why.length?' Ursache: '+why.join(', ')+'.':''));
    else if(c.sTarget<loc.rep-9)add('warn','betrieb','rep','Ruf sinkt','Gäste gehen unzufrieden.'+(why.length?' Ursache: '+why.join(', ')+'.':''));
  }
  if(S.card&&S.card.loc===loc.id){const V=cardView(S.card);if(V)add('warn','betrieb','card','Entscheidung: '+V.t,'Antworte bis Tag '+S.card.until+', sonst gilt „'+V.o[V.o.length-1][0]+'“.',['Zeigen','goto',{t:'betrieb',k:'card'}]);}
  if(c.cmp&&c.compF>=0.12)add(c.compF>=0.28?'bad':'warn','betrieb','comp','Konkurrenz: '+c.cmp.n,'Zieht etwa '+n0(c.compF*100)+' % deiner Laufkundschaft ab'+(S.day<(c.cmp.promoUntil||0)?', gerade mit Rabattaktion':'')+'. Mit dem besseren Angebot hältst du dagegen.',['Ansehen','compInfo',{id:c.cmp.id}]);
  if(loc.popup&&loc.stock<c.ek*30&&S.day<=loc.popup)add('warn','betrieb','stock','Pop-up braucht Ware','Ohne Vorrat verpasst du den Ansturm.',['Auffüllen','buy',{f:1}]);
  if(c.foods.length&&!loc.popup){const v=c.segs[1],vg=c.segs[2],vw=v.w+vg.w;
    if(!v.opt&&vw>=0.08)add(vw>=0.18?'bad':'warn','karte','veg','Nichts für Vegetarier',n0(vw*100)+' % der Gäste im '+AREAS[loc.area].n+' essen vegetarisch oder vegan. Ohne passendes Hauptgericht bleiben sie weg und nehmen ihre Freunde mit. Pommes allein zählen nicht.');
    else if(!vg.opt&&vg.w>=0.05)add('warn','karte','veg','Nichts Veganes','Etwa '+n0(vg.w*100)+' % der Gäste hier essen vegan und finden kein Hauptgericht.');
    else if(v.opt&&v.sat<c.segs[0].sat-8)add('warn','karte','veg','Vegetarische Gäste unzufrieden','Sie achten stärker auf Qualität und Abwechslung. Einfach-Qualität enttäuscht sie, ein einziges Gericht ist ihnen zu wenig.');}
  const RL=loc.regLog;
  if(RL&&RL.day===S.day-1&&loc.reg+RL.lost-RL.gain>=8){const net=RL.lost-RL.gain,base=loc.reg+net;
    if(net>base*0.05)add(net>base*0.1?'bad':'warn','betrieb','reg','Stammkunden wandern ab: −'+n0(net),'Gestern '+n0(RL.lost)+' verloren, '+n0(RL.gain)+' gewonnen.'+(RL.why.length?' Grund: '+RL.why.join(', ')+'.':''),RL.why.includes('Preise erhöht')?['Speisen','goto',{t:'karte'}]:null);}

  if(loc.last&&loc.last.res<-0.5)add('bad','betrieb','loss','Gestern Verlust: '+eur(loc.last.res),lossWhy(loc));
  else{const f=forecast(loc,c);if(f<-0.1*c.fix-20&&loc.last)add('warn','betrieb','loss','Prognose im Minus: '+eurS(f)+' pro Tag','So wie es gerade läuft, deckt der Umsatz die Kosten nicht.');}
  if(c.foods.length&&c.avgQ<T.exp-0.05&&loc.tier>=2)add('warn','karte','qual','Qualität unter Erwartung','Gäste eines '+gen(T.n)+' erwarten „'+QN[T.exp-1]+'“, auf deiner Karte liegt der Schnitt bei '+nf2.format(c.avgQ)+'.'+(loc.qual<T.exp?' Kaufe dafür die nächste Qualitätsstufe.':''));
  for(const x of c.foods.concat(c.drinks)){const id=x.P.id,m=x.m;
    if(m.price<x.ek*up-0.004)add('bad','karte','prod:'+id,x.P.n+' unter Einkaufspreis','Jede Portion kostet '+eur2(x.ek*up)+' Ware und bringt '+eur2(m.price)+'.');

  }
  for(const R of ROLES){if(R.id==='cook'&&nocook)continue;const w=Math.min(loc.want[R.id]||0,maxStaff(loc,R.id));
    if(loc.staff[R.id]<w&&!(loc.autoHire&&(loc.staff.lead||S.hq>0)&&R.id!=='cook'))add('warn','team','role:'+R.id,'Stelle frei: '+R.n,(w-loc.staff[R.id])+' von '+w+' unbesetzt.'+(loc.autoHire&&loc.staff.lead?' Die Leitung sucht Ersatz.':''));}
  const thief=loc.team.some(e=>e.trKnown&&e.tr==='dieb');
  if(loc.last&&loc.last.theft>0.5&&!thief)add('bad','team','theft','Geld fehlt in der Kasse','Gestern fehlten '+eur(loc.last.theft)+'. Jemand im Team greift zu, noch weißt du nicht, wer.');
  for(const e of loc.team){const k='emp:'+e.id;
    if(e.trKnown&&(e.tr==='dieb'||e.tr==='giftig'))add('bad','team',k,e.name+' '+TRAIT[e.tr].n,e.tr==='dieb'?'Kann fristlos entlassen werden.':'Die anderen arbeiten schlechter und kündigen eher.');
    else if(e.trKnown&&(e.tr==='unzuv'||e.tr==='schlampig'))add('warn','team',k,e.name+' '+TRAIT[e.tr].n,'Kostet Leistung und Zufriedenheit.');
    else if(S.day-e.day>=3&&e.sk<0.5&&!e.leaveDay)add('warn','team',k,e.name+' ist ungeeignet',roleName(e.role)+' leistet nur einen Bruchteil, kostet aber '+eur(e.pay)+' am Tag.');
    if(e.poach)add(loc.staff.lead?'warn':'bad','team',k,e.name+' hat ein Abwerbeangebot',e.poach.by+' bietet '+eur(e.poach.pay)+' am Tag. '+(loc.staff.lead?'Sonst entscheidet die Leitung.':'Ohne Gegenangebot geht '+e.name+' nach Tag '+e.poach.day+'.'));
    if(e.ask&&!loc.staff.lead)add('warn','team',k,e.name+' will mehr Gehalt','Fordert '+eur(e.ask.pay)+' statt '+eur(e.pay)+' am Tag. Antwort bis Tag '+e.ask.day+'.');
    if(moodOf(e)<35&&!e.leaveDay&&!e.temp)add('warn','team',k,e.name+' ist unzufrieden','Arbeitet schlechter und kündigt eher. Gehalt, Überlastung oder Kollegen prüfen.');
    if(e.leaveDay&&e.quit)add('warn','team',k,e.name+' hat gekündigt','Geht nach Tag '+(e.leaveDay-1)+'. Rechtzeitig Ersatz suchen.');}
  P.sort((a,b)=>(a.k==='bad'?0:1)-(b.k==='bad'?0:1));
  return P;
}
function lossWhy(loc){const l=loc.last,it=[['Personal',l.wages],['Miete',l.rent],['Wareneinsatz',l.cogs],['Verderb',l.waste],['Energie',l.energy],['Marketing',l.mkt],['Sonstiges',l.other],['Kassendifferenz',l.theft||0]].sort((a,b)=>b[1]-a[1]);
  return 'Umsatz '+eur(l.rev)+'. Größte Posten: '+it.slice(0,2).map(x=>x[0]+' '+eur(x[1])).join(', ')+'.';}
function coProblems(){
  const P=[],lim=dispoLimit(),cm=creditMax(),unc=uncovered(),add=(k,key,t,d)=>P.push({k,tab:'firma',key,t,d});
  if(S.strikes>0)add('bad','bank','Mahnung '+S.strikes+' von 3','Kasse bis zum Tagesabschluss über '+eur(-lim)+' bringen, sonst '+(S.strikes>=2?'Insolvenz':'nächste Mahnung')+'.');
  else if(S.cash<-lim)add('bad','bank','Dispo-Rahmen überzogen','Bleibt die Kasse bis zum Tagesabschluss unter '+eur(-lim)+', gibt es eine Mahnung.');
  else if(S.cash<0)add('warn','bank','Konto im Minus','3 % Dispozinsen pro Tag, keine Investitionen möglich.');
  if(S.loan>cm*0.75)add('warn','bank','Kreditrahmen fast ausgeschöpft',eur(S.loan)+' von '+eur(cm)+', 1 % Zinsen pro Tag.');
  if(unc)add('bad','hq',unc+(unc>1?' Betriebe':' Betrieb')+' zu viel für deine Verwaltung','Überall verfällt die Ordnung schneller. Büro ausbauen oder Standorte schließen.');
  if(S.tester){const weak=realLocs().filter(l=>l.tier>=1&&problems(l).some(p=>p.k==='bad')).map(l=>AREAS[l.area].n);add(weak.length?'bad':'warn','tester','Restauranttester unterwegs','Kommt bis Tag '+S.tester.by+' in einen deiner Betriebe ab Foodtruck.'+(weak.length?' Mit roten Problemen: '+weak.join(', ')+'.':' Halte überall Ordnung, Lager und Qualität hoch.'));}
  if(S.contract&&S.contract.type!=='tag'&&S.contract.until-S.day<=2)add('warn','contract','Liefervertrag läuft aus','„'+CONTR[S.contract.type].n+'“ endet nach Tag '+S.contract.until+'. Danach gelten wieder Tagespreise.');
  if(S.card&&!S.locs.some(l=>l.id===S.card.loc))S.card=null;
  if(S.lastDay&&S.lastDay.total<-0.5)add('warn','result','Firma gestern im Minus: '+eur(S.lastDay.total),'Summe aller Betriebe nach Verwaltung und Zinsen.');
  return P;
}

function tips(loc,c){
  if(!c.foods.length)return 'Auf der Karte steht kein Gericht. Ohne Angebot kommt niemand.';
  if(!(c.cooks>0))return 'Hier kocht niemand. Schalte im Team eine Stellenanzeige für einen Koch oder arbeite selbst mit.';

  for(let i=0;i<n;i++)P.push({x:Math.random()*FX.W,y:Math.random()*FX.H,v:k==='schnee'?0.5+Math.random()*0.9:(k==='sturm'?14:10)+Math.random()*7,l:k==='schnee'?1.2+Math.random()*2.2:9+Math.random()*12,ph:Math.random()*6.28,o:0.35+Math.random()*0.35});FX.parts=P;}

  const map={regen:'linear-gradient(180deg,rgba(70,90,110,.16),rgba(70,90,110,.05))',sturm:'linear-gradient(180deg,rgba(40,50,70,.26),rgba(40,50,70,.1))',schnee:'linear-gradient(180deg,rgba(225,235,245,.18),rgba(225,235,245,.04))',frost:'radial-gradient(ellipse at center,transparent 55%,rgba(190,220,245,.35))',heiss:'linear-gradient(180deg,rgba(255,170,60,.12),rgba(255,120,40,.04))'};

function fxFrame(){
  const k=fxKind(),c=document.getElementById('wxfx');if(!c){return;}

  const g=c.getContext('2d');g.setTransform(FX.dpr,0,0,FX.dpr,0,0);g.clearRect(0,0,FX.W,FX.H);
  if(k&&!document.hidden&&!rm&&FX.parts.length){
    if(k==='schnee'){g.fillStyle='#fff';g.strokeStyle='rgba(110,135,160,.55)';g.lineWidth=0.8;for(const p of FX.parts){p.y+=p.v;p.ph+=0.02;p.x+=Math.sin(p.ph)*0.6;if(p.y>FX.H+5){p.y=-5;p.x=Math.random()*FX.W;}g.globalAlpha=Math.min(1,p.o+0.35);g.beginPath();g.arc(p.x,p.y,p.l,0,6.283);g.fill();g.stroke();}}
    else{const wind=k==='sturm'?-4.5:-1.4;g.strokeStyle=k==='sturm'?'#6E87A0':'#7895B1';g.lineWidth=1.4;g.lineCap='round';
      for(const p of FX.parts){p.y+=p.v;p.x+=wind;if(p.y>FX.H+20||p.x<-20){p.y=-20-Math.random()*40;p.x=Math.random()*(FX.W+80);}g.globalAlpha=p.o;g.beginPath();g.moveTo(p.x,p.y);g.lineTo(p.x+wind*p.l/p.v,p.y+p.l);g.stroke();}
      if(k==='sturm'){const now=Date.now();if(now>FX.next){FX.flash=1;FX.next=now+6000+Math.random()*9000;}if(FX.flash>0){g.globalAlpha=FX.flash*0.35;g.fillStyle='#fff';g.fillRect(0,0,FX.W,FX.H);FX.flash-=0.06;}}}
    g.globalAlpha=1;}
  requestAnimationFrame(fxFrame);}

function telInp(k){if(!TEL||!TEL.on)return;TEL.inp[k]=(TEL.inp[k]||0)+1;if(!TEL.first['inp:'+k])TEL.first['inp:'+k]=[TEL.run,S?S.day:0,Date.now()];TEL.dayInp++;TSY.dirty=1;}
function telTick(sec){if(!TEL||!TEL.on||!S||sec>30||document.hidden)return;const ms=sec*1000;
  const t=ui.rush&&!ui.rush.over?'rush':ui.modal?'dialog':ui.tab;TEL.tabs[t]=(TEL.tabs[t]||0)+ms;TEL.ms.play+=ms;if(S.paused)TEL.ms.paused+=ms;
  const se=TEL.sess[TEL.sess.length-1];if(se){se.e=Date.now();se.d1=S.day;se.ms+=ms;}}
function telSession(){if(!TEL)return;TEL.sess.push({s:Date.now(),e:Date.now(),d0:S.day,d1:S.day,ms:0,a:0,r:TEL.run,w:typeof innerWidth!=='undefined'?innerWidth:0});if(TEL.sess.length>80)TEL.sess.splice(0,TEL.sess.length-80);TSY.dirty=1;}
function telAway(sec){if(!TEL||!TEL.on)return;TEL.away.n++;TEL.away.s+=Math.round(sec);telEv('weg',Math.round(sec/60)+' min');}
function telRush(R){if(!TEL||!TEL.on)return;TEL.rush.push([TEL.run,S.day,R.done,R.perfect,R.missed,R.burnt,Math.round(R.tips),R.best||0]);if(TEL.rush.length>150)TEL.rush.splice(0,TEL.rush.length-150);TSY.dirty=1;}
function telRun(why){if(!TEL)return;TEL.runs.push([TEL.run,why,S.day,Math.round(S.best||0),S.locs.length,S.maxTier,Date.now()]);telEv('ende',why);TEL.run++;TSY.dirty=1;TSY.dayDirty=1;telSave();telFlush(true);}
const NECK={'Küche':'k','Service':'s','Theke':'t','Lager':'l','Nachfrage':'n'};
function telDay(offline,total){if(!TEL||!TEL.on||!S)return;
  const L=S.locs.map(l=>{const t=l.last||{},c=calc(l);return [l.tier,l.area,Math.round(l.rep),Math.round(l.reg||0),Math.round(t.served||0),Math.round(t.lost||0),Math.round(t.res||0),l.team.filter(e=>!e.temp).length,l.qual,Math.round(l.ord),NECK[c.neck]||c.neck||'',l.staff.lead?1:0,Math.round(t.rev||0),c.foods.length,(l.combos||[]).length,l.sig?l.sig.r||1:0,l.mkt||0];});
  const pr={};if(!offline){for(const l of S.locs)for(const x of problems(l))pr[x.key.replace(/\d+/g,'#')]=1;for(const x of coProblems())pr['co:'+x.key]=1;}
  TEL.days.push({r:TEL.run,d:S.day,o:offline?1:0,c:Math.round(S.cash),n:Math.round(total),v:Math.round(companyValue()),ln:Math.round(S.loan||0),st:S.strikes,sp:S.speed||0.5,pa:S.paused?1:0,a:TEL.dayAct,i:TEL.dayInp,hq:S.hq,L,p:Object.keys(pr)});
  TEL.dayAct=0;TEL.dayInp=0;if(TEL.days.length>600)TEL.days.splice(0,TEL.days.length-600);
  const A=(S.meta&&S.meta.ach)||{};for(const k in A)if(!TEL.ach[k]){TEL.ach[k]=[TEL.run,S.day];telEv('erfolg',k);}
  if(S.strikes>0&&!offline)telEv('mahnung',String(S.strikes));
  const pl=TEL._lastLocs||0;if(S.locs.length!==pl){if(pl)telEv('betriebe',pl+'→'+S.locs.length);TEL._lastLocs=S.locs.length;}
  if((TEL._lastTier||0)<S.maxTier){if(TEL._lastTier!=null)telEv('stufe',String(S.maxTier));TEL._lastTier=S.maxTier;}
  if(S.bankrupt&&!TEL._bk){TEL._bk=1;telEv('insolvenz','Tag '+S.day);}if(!S.bankrupt)TEL._bk=0;
  TSY.dirty=1;TSY.dayDirty=1;}
function telSummary(){const loc=S.locs;return {did:TEL.did,build:BUILD,since:TEL.since,updated:Date.now(),run:TEL.run,act:TEL.act,first:TEL.first,tabs:TEL.tabs,inp:TEL.inp,sess:TEL.sess.slice(-40),runs:TEL.runs,ev:TEL.ev.slice(-200),rush:TEL.rush.slice(-60),away:TEL.away,ms:TEL.ms,ach:TEL.ach,
  allAct:Object.keys(ACT).filter(k=>typeof ACT[k]==='function'),
  now:{day:S.day,cash:Math.round(S.cash),best:Math.round(S.best||0),locs:loc.length,maxTier:S.maxTier,speed:S.speed||0.5,fx:S.fx!==false,ep:S.meta?S.meta.ep:0,runs:S.meta?S.meta.runs||0:0},
  dev:{w:typeof innerWidth!=='undefined'?innerWidth:0,touch:typeof navigator!=='undefined'&&navigator.maxTouchPoints>0?1:0,lang:typeof navigator!=='undefined'?navigator.language:''}};}
async function telFlush(force){const db=TSY.db;if(!TEL||!TEL.on||!db||TSY.busy)return;if(!force&&!TSY.dirty)return;TSY.busy=1;
  try{TSY.dirty=0;await db.doc('tel/'+TEL.did).set(telSummary());
    if(TSY.dayDirty){TSY.dayDirty=0;const run=TEL.run,D=TEL.days.filter(x=>x.r===run||x.r===run-1);const groups={};
      for(const x of D){const id=TEL.did+'-r'+x.r+'-'+Math.floor(x.d/30);(groups[id]=groups[id]||[]).push(x);}
      const ids=Object.keys(groups).slice(-2);for(const id of ids)await db.doc('teldays/'+id).set({did:TEL.did,id,days:groups[id]});}
    TSY.st='sync';TSY.last=Date.now();TSY.err='';}
  catch(e){TSY.st='fehler';TSY.err=String(e&&e.message||e).slice(0,80);TSY.dirty=1;}
  TSY.busy=0;}
function telInit(){telLoad();telSession();telSave();
  try{if(window.claude&&window.claude.use){window.claude.use('db').then(db=>{if(db){TSY.db=db;TSY.st='bereit';TSY.dayDirty=1;telFlush(true);}else TSY.st='lokal';}).catch(()=>{TSY.st='lokal';});}}catch(e){}
  setInterval(()=>{telSave();telFlush(false);},45000);
  document.addEventListener('visibilitychange',()=>{if(document.hidden){telSave();telFlush(true);}});}
ACT.telOn=function(){if(!TEL)return;TEL.on=!TEL.on;telSave();};
ACT.telCopy=function(){if(!TEL)return;const txt=JSON.stringify({summary:telSummary(),days:TEL.days.slice(-120)});
  const done=()=>toast('Protokoll kopiert','good');
  try{navigator.clipboard.writeText(txt).then(done,()=>{ui.modal={title:'Spielprotokoll',html:'<textarea readonly style="width:100%;height:240px;font:12px var(--f-mono)">'+txt.replace(/</g,'&lt;')+'</textarea>'};render();});}catch(e){}
  return 'keep';};
function telCard(){if(!TEL)return '';const days=TEL.days.length,min=Math.round(TEL.ms.play/60000),used=Object.keys(TEL.act).length;
  const st=!TEL.on?chip('warn','aus','mute'):TSY.st==='sync'?chip('check','hochgeladen','good'):TSY.st==='fehler'?chip('warn','Upload klemmt','warn'):chip('box','nur lokal');
  return '<div class="card"><div class="row top"><div class="grow"><div class="row"><h3>Spielprotokoll</h3>'+hb('tel')+'</div></div><button type="button" class="switch" data-a="telOn" aria-pressed="'+TEL.on+'">'+(TEL.on?'an':'aus')+'</button></div>'+
    chips([st,chip('clock',min+' min'),chip('calendar',days+' Tage'),chip('bolt',used+' Aktionen'),chip('guests',TEL.sess.length+' Sitzungen')])+
    ht('tel','Das Spiel merkt sich, was du nutzt und was nicht, wie lange du in welchem Bereich bist und wie sich Kasse, Betriebe und Probleme Tag für Tag entwickeln. Es wird mit dem Spiel gespeichert, damit Claude es auslesen und das Spiel gezielt verbessern kann. Es enthält keine persönlichen Daten außer Bildschirmbreite und Sprache.')+
    '<div class="btns" style="margin-top:8px">'+B('Protokoll kopieren','telCopy',{},{cls:'sm'})+'</div></div>';}
function boot(data){
  S=(data&&data.v===1&&Array.isArray(data.locs)&&data.locs.length)?data:(loadSave()||newGame());
  if(S.maxTier==null)S.maxTier=Math.max(...S.locs.map(l=>l.tier));
  migrate();if(S.qDay!==S.day)genQuests();telInit();TEL._lastLocs=TEL._lastLocs||S.locs.length;if(TEL._lastTier==null)TEL._lastTier=S.maxTier;
  let p='M0 20';for(let i=0;i<=50;i++){const x=i/50;p+=' L'+(x*100).toFixed(1)+' '+(20-phase(Math.min(0.999,x))/1.5*17).toFixed(2);}
  document.getElementById('curve').setAttribute('d',p+' L100 20 Z');
  const gap=(Date.now()-(S.lastSeen||Date.now()))/1000;
  if(gap>30){telAway(gap);awayReport(away(gap));}
  if(S.intro)ACT.intro();
  let last=Date.now(),lastSave=Date.now();
  setInterval(()=>{
    const now=Date.now();let gap=(now-last)/1000;last=now;telTick(gap);callTick();
    if(gap>30){telAway(gap);awayReport(away(gap));}
    else if(!S.paused&&!S.bankrupt){gap*=S.speed||0.5;if(ui.rush&&!ui.rush.over)gap*=0.25;while(gap>0){const dt=Math.min(0.5,gap);step(dt,false);gap-=dt;if(S.bankrupt)break;}}
    if(now-lastSave>8000){save();lastSave=now;checkAch();}
    const ae=document.activeElement,busy=(now-ui.down<6000)||(ae&&(ae.tagName==='SELECT'||ae.tagName==='TEXTAREA'));
    if(!busy)render();else renderHeaderSafe();
  },250);
  function renderHeaderSafe(){const $=document.getElementById('cash');$.textContent=eur(S.cash);$.className='cash'+(S.cash<0?' neg':'');}
  document.addEventListener('pointerdown',()=>{ui.down=Date.now();});
  document.getElementById('rush').addEventListener('pointerdown',e=>{const t=e.target.closest('[data-rt]'),z=e.target.closest('[data-rs]');if(t||z){e.preventDefault();e.stopPropagation();ui.down=0;if(t)rushTap(t.dataset.rt);else rushSlotTap(z.dataset.rs);}});
  const up=()=>{ui.down=0;};
  document.addEventListener('pointerup',up);document.addEventListener('pointercancel',up);
  document.addEventListener('click',e=>{
    const b=e.target.closest('[data-a]');if(!b||b.disabled)return;
    const f=ACT[b.dataset.a];if(!f)return;telAct(b.dataset.a,b.dataset);
    const r=f(b.dataset);ui.down=0;if(r!=='keep')render();
  });
  document.addEventListener('input',e=>{
    const el=e.target,k=el.dataset&&el.dataset.i;if(!k)return;
    if(k==='newArea'||k==='newTier'||k==='adRole'||k==='sigP'||k==='cbMain'||k==='cbSide'||k==='cbDrink')return;
    const m=cur().menu[el.dataset.p];if(!m)return;
    if(k==='price')m.price=+el.value;else if(k==='q')m.q=clamp(+el.value,1,cur().qual);else if(k==='p')m.p=+el.value/100;
    updateProds();
  });
  document.addEventListener('change',e=>{
    const el=e.target,k=el.dataset&&el.dataset.i;if(!k)return;telInp(k);
    if(k==='newArea')ui.newArea=+el.value;if(k==='newTier')ui.newTier=+el.value;if(k==='adRole')ui.adRole=el.value;if(k==='sigP')ui.sigP=el.value;if(k==='cbMain'||k==='cbSide'||k==='cbDrink'){ui.cb=ui.cb||{};ui.cb[k==='cbMain'?'main':k==='cbSide'?'side':'drink']=el.value;}
    el.blur&&(k==='newArea'||k==='newTier'||k==='adRole'||k==='sigP'||k==='cbMain'||k==='cbSide'||k==='cbDrink')&&el.blur();render();
  });
  document.addEventListener('visibilitychange',()=>{if(document.hidden)save();});
  window.addEventListener('pagehide',save);
  const hot=window.claude&&window.claude.hot;if(hot&&hot.snapshot)try{hot.snapshot(()=>S);}catch(e){}
  render();fxStart();
}
if(typeof document!=='undefined'){
  const hot=window.claude&&window.claude.hot;
  if(hot&&hot.ready)hot.ready(boot);else boot((hot&&hot.data)||{});
}else if(typeof module!=='undefined'){
  module.exports={problems,coProblems,genQuests,worldDay,CARDS,testerVisit,companyValue,realLocs,migrate:()=>migrate(),calcX:l=>calc(l),genApp,hireApp,staffDay,appScore,migrate,newGame,newLoc,step,calc,forecast,away,ACT,TIERS,PRODS,MACH,ROLES,AREAS,QCOST,DAY,wage,get S(){return S;},set S(v){S=v;},ui};
}
</script>
