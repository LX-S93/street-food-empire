<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Food Empire">
<meta name="theme-color" content="#151a20">
<title>Imbiss-Imperium</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Caveat:wght@600;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
</head>
<body>
<header id="top"><div class="awning" aria-hidden="true"></div><div class="wrap">
  <div class="bar"><div class="brand">Imbiss-Imperium</div><div class="barR"><div class="dayInfo" id="dayInfo">Tag 1</div><div class="wxInfo" id="wxInfo"></div></div></div>
  <div class="register">
    <div><div class="lbl">Kasse</div><div class="cash" id="cash">300 €</div></div>
    <div class="side"><div class="lbl">Fixkosten heute</div><div id="fix">–</div><div class="lbl" style="margin-top:4px">Ergebnis gestern</div><div id="yest">–</div></div>
  </div>
  <div class="clock" aria-hidden="true"><svg viewBox="0 0 100 20" preserveAspectRatio="none"><path id="curve" d=""></path></svg><b id="dayFill"></b><i id="dayCur"></i></div>
  <div id="alert" role="status"></div>
</div></header>
<main id="view"></main>
<nav id="tabs" aria-label="Bereiche"><div class="wrap">
  <button type="button" data-a="tab" data-t="stadt"><b class="badge" aria-hidden="true"></b><span class="ico"><img src="art/ic/tab_stadt.webp" alt="" aria-hidden="true"></span><span>Stadt</span></button>
  <button type="button" data-a="tab" data-t="betrieb"><b class="badge" aria-hidden="true"></b><span class="ico"><img src="art/ic/tab_betrieb.webp" alt="" aria-hidden="true"></span><span>Laden</span></button>
  <button type="button" data-a="tab" data-t="karte"><b class="badge" aria-hidden="true"></b><span class="ico"><img src="art/ic/tab_karte.webp" alt="" aria-hidden="true"></span><span>Speisen</span></button>
  <button type="button" data-a="tab" data-t="team"><b class="badge" aria-hidden="true"></b><span class="ico"><img src="art/ic/tab_team.webp" alt="" aria-hidden="true"></span><span>Team</span></button>
  <button type="button" data-a="tab" data-t="ausbau"><b class="badge" aria-hidden="true"></b><span class="ico"><img src="art/ic/tab_ausbau.webp" alt="" aria-hidden="true"></span><span>Ausbau</span></button>
  <button type="button" data-a="tab" data-t="firma"><b class="badge" aria-hidden="true"></b><span class="ico"><img src="art/ic/tab_firma.webp" alt="" aria-hidden="true"></span><span>Büro</span></button>
</div></nav>
<div id="wxtint" aria-hidden="true"></div><canvas id="wxfx" aria-hidden="true"></canvas>
<div id="toasts" aria-live="polite"></div>
<div id="modal" role="dialog" aria-modal="true"></div>
<div id="call"></div>
<div id="rush" role="dialog" aria-modal="true" aria-label="Küchenschicht"></div>

<script type="module" src="./src/main.ts"></script>
</body>
</html>
